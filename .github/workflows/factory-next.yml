# Factory, step 1: when the owner merges a ticket's PR by hand, label the next ticket ready-for-agent.
# No AI here: scripts/factory.py next takes backlog_order's next ticket (dependencies first, then
# the one most painful to change later). It does nothing while a ticket is queued or stuck.
name: factory-next

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # backup, in case a merge event was missed

jobs:
  next:
    # The factory's own merges start the next ticket from the merge job, after its cleanup. This
    # trigger is for the owner's hand-merges: PRs the factory handed over (needs-approval, agent-stuck).
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.merged
      && startsWith(github.event.pull_request.head.ref, 'ticket-')
      && (contains(github.event.pull_request.labels.*.name, 'needs-approval')
          || contains(github.event.pull_request.labels.*.name, 'agent-stuck')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Label the next ticket
        # A personal access token, not GITHUB_TOKEN: a label added with GITHUB_TOKEN would not
        # start factory-run.
        env:
          GH_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: python3 scripts/factory.py next
